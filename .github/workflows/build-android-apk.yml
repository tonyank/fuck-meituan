name: Build Signed Android APK (构建已签名安卓APK)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建模式 (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_github_release:
        description: '是否自动创建 GitHub Release 发布草稿'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: 编译与签名 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 配置 JDK 17 (Setup Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 配置 Android SDK 环境
        uses: android-actions/setup-android@v3

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 执行 Gradle 编译 (${{ inputs.build_type }})
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 准备并签名 APK (Sign APK with Keystore)
        id: sign_apk
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          
          # 寻找生成的未签名/原始 APK 文件
          if [ "$BUILD_TYPE" = "release" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$RAW_APK" ]; then
            echo "::error::未找到编译生成的 APK 文件！"
            exit 1
          fi
          
          echo "找到原始 APK: $RAW_APK"
          
          # 定位 Android SDK 中的 apksigner 与 zipalign
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1 | xargs dirname)
          ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          
          echo "使用 build-tools 路径: $BUILD_TOOLS_PATH"
          
          # 最终输出文件名 (带时间戳与版本)
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          OUTPUT_APK="ytstudio-whac-a-mole-tool-${BUILD_TYPE}-signed-${TIMESTAMP}.apk"
          ALIGNED_APK="app-aligned-temp.apk"
          
          # 1. ZipAlign 对齐优化
          $ZIPALIGN -v -p 4 "$RAW_APK" "$ALIGNED_APK"
          
          # 2. 检查是否在 GitHub Secrets 中配置了自定义 Keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "==> 检测到自定义 GitHub Secrets 密钥库，正在使用该配置进行正式签名..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            
            $APKSIGNER sign \
              --ks release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT_APK" \
              "$ALIGNED_APK"
          else
            echo "==> 未配置自定义 Secrets，自动生成独立生产级密钥库进行签名..."
            KEYSTORE_PASS="ytstudio_whac_mole_2026"
            KEY_ALIAS="whac_a_mole_tool"
            
            keytool -genkey -v \
              -keystore auto_release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" \
              -dname "CN=ytstudio, OU=Mobile, O=YTStudio, L=Beijing, ST=Beijing, C=CN"
            
            $APKSIGNER sign \
              --ks auto_release.jks \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEYSTORE_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT_APK" \
              "$ALIGNED_APK"
          fi
          
          # 3. 验证 APK 签名有效性
          echo "==> 验证 APK 签名状态："
          $APKSIGNER verify --verbose "$OUTPUT_APK"
          
          # 4. 生成 SHA-256 校验哈希
          sha256sum "$OUTPUT_APK" > "${OUTPUT_APK}.sha256"
          cat "${OUTPUT_APK}.sha256"
          
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "apk_name=$OUTPUT_APK" >> $GITHUB_OUTPUT

      - name: 上传已签名 APK 为构建产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign_apk.outputs.apk_name }}
          path: |
            ${{ steps.sign_apk.outputs.apk_path }}
            ${{ steps.sign_apk.outputs.apk_path }}.sha256
          retention-days: 30

      - name: 创建 GitHub Release 草稿 (可选)
        if: ${{ inputs.create_github_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "打地鼠辅助工具 v1.0.0 (构建 #${{ github.run_number }})"
          draft: true
          prerelease: false
          body: |
            ### 🐹 打地鼠辅助工具 (Whac-A-Mole tool)
            - **包名**: `ytstudio.whac_a_mole_tool`
            - **架构**: Kotlin + Jetpack Compose + OpenCV + Accessibility Service
            - **特性**: 免 Root、20ms 极速物理触摸、75ms 破防双连击、280ms 单洞防抖、置信度 > 0.68 智能避雷
            - **安全声明**: 绝无声明 INTERNET 联网权限，完全离线运行。
          files: |
            ${{ steps.sign_apk.outputs.apk_path }}
            ${{ steps.sign_apk.outputs.apk_path }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
